# =============================================================================
# env.conf - Central configuration for the virtual simulation platform.
# Every value can be overridden by an environment variable of the same name,
# e.g.  CLUSTER_NAME=staging ./setup.sh
# =============================================================================
CLUSTER_NAME="${CLUSTER_NAME:-vsim}"
K8S_NAMESPACE="${K8S_NAMESPACE:-vsim}"

# Pinned tool versions (pinning = repeatable setups across machines)
KIND_VERSION="${KIND_VERSION:-v0.23.0}"
KUBECTL_VERSION="${KUBECTL_VERSION:-v1.30.2}"

# Networking
HOST_PORT="${HOST_PORT:-8080}"        # port exposed on the host machine
NODE_PORT="${NODE_PORT:-30080}"       # Kubernetes NodePort (30000-32767)
HOSTS_ENTRY_NAME="${HOSTS_ENTRY_NAME:-vsim.local}"
FIREWALL_ENABLE="${FIREWALL_ENABLE:-true}"   # open HOST_PORT in ufw if ufw exists

# Timeouts / retries
ROLLOUT_TIMEOUT="${ROLLOUT_TIMEOUT:-180s}"
RETRY_ATTEMPTS="${RETRY_ATTEMPTS:-3}"
RETRY_DELAY="${RETRY_DELAY:-5}"
